<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#14101c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Bunker do Loop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #14101c; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10; background: #14101c; color: #f2e6c9;
        font-family: 'VT323', monospace; font-size: 28px; text-align: center;
        flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      }
      #rotate.show { display: flex; }
      #rotate .phone { width: 60px; height: 100px; border: 6px solid #f2e6c9; border-radius: 10px; margin-bottom: 24px; animation: spin 2s steps(4) infinite; }
      @keyframes spin { 0%, 40% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><div id="rotate-text"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
